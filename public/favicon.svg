<svg
  xmlns="http://www.w3.org/2000/svg"
  width="48"
  height="46"
  viewBox="0 0 48 46"
  fill="none"
>
  <defs>
    <linearGradient id="ccCartGradient" x1="8" y1="5" x2="40" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#47BFFF"/>
      <stop offset="0.5" stop-color="#863BFF"/>
      <stop offset="1" stop-color="#7E14FF"/>
    </linearGradient>

    <filter
      id="ccCartShadow"
      x="-10"
      y="-8"
      width="68"
      height="64"
      filterUnits="userSpaceOnUse"
    >
      <feDropShadow
        dx="0"
        dy="3"
        stdDeviation="3"
        flood-color="#863BFF"
        flood-opacity="0.25"
      />
    </filter>
  </defs>

  <!-- Cart -->
  <g filter="url(#ccCartShadow)">

    <!-- Cart handle -->
    <path
      d="M5 7H9.2C10.1 7 10.9 7.6 11.15 8.45L16.9 29.1C17.2 30.2 18.2 31 19.35 31H37.3C38.35 31 39.25 30.35 39.6 29.35L44 16.5"
      stroke="url(#ccCartGradient)"
      stroke-width="3.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Cart basket -->
    <path
      d="M13.1 13.5H43.4L39.7 27.1C39.35 28.4 38.15 29.3 36.8 29.3H17.5"
      fill="url(#ccCartGradient)"
      fill-opacity="0.16"
      stroke="url(#ccCartGradient)"
      stroke-width="3.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- CC badge inside cart -->
    <rect
      x="19"
      y="15.5"
      width="17"
      height="10"
      rx="5"
      fill="white"
      fill-opacity="0.96"
    />

    <!-- First C -->
    <path
      d="M26.3 18.1C25.65 17.55 24.75 17.25 23.85 17.25C21.85 17.25 20.35 18.7 20.35 20.5C20.35 22.3 21.85 23.75 23.85 23.75C24.75 23.75 25.65 23.45 26.3 22.9"
      stroke="#863BFF"
      stroke-width="1.8"
      stroke-linecap="round"
    />

    <!-- Second C -->
    <path
      d="M34.2 18.1C33.55 17.55 32.65 17.25 31.75 17.25C29.75 17.25 28.25 18.7 28.25 20.5C28.25 22.3 29.75 23.75 31.75 23.75C32.65 23.75 33.55 23.45 34.2 22.9"
      stroke="#47BFFF"
      stroke-width="1.8"
      stroke-linecap="round"
    />

    <!-- Wheels -->
    <circle
      cx="21"
      cy="36.5"
      r="3"
      fill="#863BFF"
    />

    <circle
      cx="35"
      cy="36.5"
      r="3"
      fill="#863BFF"
    />

    <!-- Wheel highlights -->
    <circle
      cx="21"
      cy="36.5"
      r="1"
      fill="white"
      fill-opacity="0.9"
    />

    <circle
      cx="35"
      cy="36.5"
      r="1"
      fill="white"
      fill-opacity="0.9"
    />
  </g>
</svg>
